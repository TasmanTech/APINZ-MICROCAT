[pytest]
# Run from the folder that holds microcat_runner.py:
#     python -m pytest tests                offline - safe anywhere
#     set MICROCAT_LIVE=1
#     python -m pytest tests\live -v        the real Microcat, read-only
markers =
    live: uses the real API HELPER browser and Microcat session (MICROCAT_LIVE=1)
    slow: takes a minute or more
